<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Simpang Studio | Professional 3D Suite</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root { 
            --primary: #10b981; 
            --primary-dark: #059669;
            --bg-light: #f1f5f9;
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        body { 
            background: var(--bg-light); 
            font-family: 'Inter', sans-serif; 
            color: #1e293b;
            padding-top: 20px;
        }

        /* --- LOGIN AREA POJOK KANAN ATAS --- */
        .admin-login-wrapper {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1050;
        }

        .glass-login-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 10px 18px;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .glass-login-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.15);
            background: white;
        }

        /* --- UI COMPONENTS --- */
        .app-container { max-width: 1000px; margin: 2rem auto; position: relative; }

        .card { 
            border: none; 
            border-radius: 20px; 
            box-shadow: var(--card-shadow); 
            background: #ffffff;
            margin-bottom: 1.5rem;
        }

        .nav-pills { background: #e2e8f0; padding: 6px; border-radius: 14px; display: inline-flex; }
        .nav-pills .nav-link { 
            color: #64748b; 
            font-weight: 600; 
            border-radius: 10px; 
            padding: 10px 25px;
        }
        .nav-pills .nav-link.active { 
            background: var(--primary); 
            color: white; 
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); 
        }

        .result-display {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            padding: 2rem;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .btn-primary-studio {
            background: var(--primary);
            border: none;
            padding: 12px;
            font-weight: 700;
            border-radius: 12px;
            color: white;
            transition: 0.3s;
        }

        .btn-primary-studio:hover { background: var(--primary-dark); transform: translateY(-2px); }

        .stat-card-new {
            padding: 1.25rem;
            border-radius: 20px;
            background: white;
            border: 1px solid #edf2f7;
        }

        #studio-toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 10000; padding: 15px 30px; border-radius: 50px; 
            background: #1e293b; color: white; font-weight: 600;
            display: none; animation: fadeInDown 0.4s ease;
        }
        @keyframes fadeInDown { from { transform: translate(-50%, -20px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
        
        .chart-container { position: relative; height: 250px; width: 100%; }
        .btn-action { padding: 6px 12px; border-radius: 8px; font-size: 0.75rem; font-weight: 700; border: 1px solid transparent; }
        .btn-edit { color: #3b82f6; background: rgba(59, 130, 246, 0.05); }
        .btn-del { color: #ef4444; background: rgba(239, 68, 68, 0.05); }
        .badge-custom { padding: 4px 10px; border-radius: 6px; font-weight: 600; background: #f1f5f9; color: #475569; font-size: 0.75rem; }
    </style>
</head>
<body>

<div id="studio-toast">Data Berhasil Disimpan! ✅</div>

<div class="admin-login-wrapper">
    <div id="authStatus">
        <button class="glass-login-card border-0" data-bs-toggle="modal" data-bs-target="#loginModal">
            <span class="me-2">🔐</span>
            <span class="fw-bold text-dark" style="font-size: 0.85rem;">Admin Login</span>
        </button>
    </div>
</div>

<div class="app-container px-3">
    <div class="mb-5">
        <h2 class="fw-800 m-0" style="letter-spacing: -1.5px; font-size: 2.5rem;">Simpang<span style="color:var(--primary)">Studio.</span></h2>
        <p class="text-muted fw-500 m-0">Professional 3D Printing Business Manager</p>
    </div>

    <div class="modal fade" id="loginModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg" style="border-radius: 24px;">
                <div class="modal-body p-4 p-md-5 text-center">
                    <div class="d-inline-block bg-light p-3 rounded-circle mb-3">🔒</div>
                    <h4 class="fw-800 mb-4">Admin Access</h4>
                    <input type="email" id="loginEmail" class="form-control mb-3" placeholder="Email Admin">
                    <input type="password" id="loginPassword" class="form-control mb-4" placeholder="Password">
                    <button class="btn btn-primary-studio w-100 mb-2" onclick="handleLogin()">Masuk</button>
                    <button class="btn btn-link btn-sm text-muted" data-bs-dismiss="modal">Batal</button>
                </div>
            </div>
        </div>
    </div>

    <div class="text-center mb-4">
        <ul class="nav nav-pills" id="mainTabs">
            <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#calc">⚡ Kalkulator</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#history">📜 Riwayat</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#inventory">📦 Material</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#setup">⚙️ Setup</button></li>
        </ul>
    </div>

    <div class="tab-content">
        <div class="tab-pane fade show active" id="calc">
            <div class="row">
                <div class="col-lg-8">
                    <div class="card"><div class="card-body p-4">
                        <h6 class="fw-bold mb-4 text-uppercase small text-muted">Identitas Pesanan</h6>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Nama Pelanggan</label>
                                <input class="form-control" id="customer" placeholder="Nama pemesan">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Nama Item / Model</label>
                                <input class="form-control" id="itemName" placeholder="Contoh: Gearbox Part">
                            </div>
                        </div>
                    </div></div>

                    <div class="card"><div class="card-body p-4">
                        <h6 class="fw-bold mb-4 text-uppercase small text-muted">Parameter Teknis</h6>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Pilih Material</label>
                                <select id="materialSelect" class="form-select"></select>
                            </div>
                            <div class="col-md-3 col-6">
                                <label class="form-label">Berat (gr)</label>
                                <input type="number" class="form-control" id="weight" placeholder="0">
                            </div>
                            <div class="col-md-3 col-6">
                                <label class="form-label">Waktu (H:M)</label>
                                <input type="time" class="form-control" id="time" value="01:00">
                            </div>
                            <div class="col-md-3 col-6">
                                <label class="form-label">Support (gr)</label>
                                <input type="number" class="form-control" id="support" value="0">
                            </div>
                            <div class="col-md-3 col-6">
                                <label class="form-label">Waste (gr)</label>
                                <input type="number" class="form-control" id="waste" value="0">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Harga per Gram</label>
                                <input class="form-control bg-light fw-bold" id="priceGram" readonly>
                            </div>
                        </div>
                    </div></div>
                </div>

                <div class="col-lg-4">
                    <div class="result-display shadow-sm">
                        <p class="small text-uppercase fw-600 mb-1">Total Harga Jual</p>
                        <h2 id="total">Rp 0</h2>
                        <div id="breakdown" class="small mt-2 opacity-75"></div>
                    </div>

                    <div class="card"><div class="card-body p-4">
                        <h6 class="fw-bold mb-3 text-uppercase small text-muted">Adjustment</h6>
                        <div class="row g-2 mb-3">
                            <div class="col-6"><label class="form-label small">Profit (%)</label><input type="number" class="form-control" id="profit" value="30"></div>
                            <div class="col-6"><label class="form-label small">Risk (%)</label><input type="number" class="form-control" id="risk" value="10"></div>
                            <div class="col-6"><label class="form-label small text-danger">Disk (%)</label><input type="number" class="form-control border-danger" id="discount" value="0"></div>
                            <div class="col-6"><label class="form-label small">PPN</label>
                                <select id="taxActive" class="form-select">
                                    <option value="0">0%</option>
                                    <option value="11">11%</option>
                                </select>
                            </div>
                            <div class="col-12 mt-2">
                                <label class="form-label small fw-bold">Status Bayar</label>
                                <select id="paymentStatus" class="form-select border-success text-success fw-bold">
                                    <option value="LUNAS">LUNAS</option>
                                    <option value="BELUM LUNAS">BELUM LUNAS</option>
                                </select>
                            </div>
                        </div>
                        <button class="btn btn-primary-studio w-100 mb-2 shadow-sm" onclick="calculateAndSave()">HITUNG & SIMPAN</button>
                        <button class="btn btn-dark w-100 border-0 py-2 fw-bold" onclick="exportPDF()">📄 CETAK INVOICE</button>
                        <div class="mt-3 text-center border-top pt-2"><span id="invDisplay" class="fw-bold small text-muted">-</span></div>
                    </div></div>
                </div>
            </div>
        </div>

        <div class="tab-pane fade" id="history">
            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <div class="stat-card-new shadow-sm">
                        <small class="text-muted fw-600 d-block">Total Omzet</small>
                        <h4 class="fw-800 m-0 text-success" id="statRevenue">Rp 0</h4>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="stat-card-new shadow-sm">
                        <small class="text-muted fw-600 d-block">Total Profit</small>
                        <h4 class="fw-800 m-0 text-info" id="statProfit">Rp 0</h4>
                    </div>
                </div>
                <div class="col-md-4">
                    <input type="text" id="historySearch" class="form-control h-100" placeholder="Cari invoice/nama..." onkeyup="renderHistory()">
                </div>
            </div>
            <div class="card mb-4"><div class="card-body"><div class="chart-container"><canvas id="performanceChart"></canvas></div></div></div>
            <div class="card">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="bg-light">
                            <tr><th class="ps-4">Invoice</th><th>Pelanggan</th><th>Item</th><th>Status</th><th>Total</th><th class="text-center">Aksi</th></tr>
                        </thead>
                        <tbody id="historyList"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="tab-pane fade" id="inventory">
            <div class="card"><div class="card-body p-4">
                <h5 class="fw-bold mb-4">Master Filamen</h5>
                <div class="row g-2 mb-4 bg-light p-3 rounded-4">
                    <div class="col-md-6"><input id="matName" class="form-control" placeholder="Nama Filamen"></div>
                    <div class="col-md-4"><input id="matPrice" type="number" class="form-control" placeholder="Harga / Kg"></div>
                    <div class="col-md-2"><button id="btnSaveMat" class="btn btn-primary-studio w-100" onclick="saveMaterial()">Tambah</button></div>
                </div>
                <div class="list-group list-group-flush" id="materialList"></div>
            </div></div>
        </div>

        <div class="tab-pane fade" id="setup">
            <div class="card"><div class="card-body p-4">
                <h5 class="fw-bold mb-4">Biaya Operasional</h5>
                <div class="row g-3">
                    <div class="col-md-4"><label class="form-label">Depresiasi Mesin/jam</label><input id="depr" class="form-control" type="number" value="2100"></div>
                    <div class="col-md-4"><label class="form-label">Jasa Operator/jam</label><input id="operator" class="form-control" type="number" value="2000"></div>
                    <div class="col-md-4"><label class="form-label">Watt Mesin</label><input id="watt" class="form-control" type="number" value="100"></div>
                    <div class="col-md-6"><label class="form-label">Tarif Listrik (kWh)</label><input id="kwh" class="form-control" type="number" value="1500"></div>
                    <div class="col-md-6"><label class="form-label">Maintenance/jam</label><input id="maint" class="form-control" type="number" value="750"></div>
                </div>
                <div class="mt-4 border-top pt-3"><button class="btn btn-outline-warning btn-sm" onclick="resetInvCounter()">Reset No. Invoice</button></div>
            </div></div>
        </div>
    </div>
</div>

<script>
    const rp = n => 'Rp ' + (Math.round(n) || 0).toLocaleString('id-ID');
    let isEditMode = false;
    let performanceChart = null;
    let lastCalculatedData = {};

    function getMaterials(){ return JSON.parse(localStorage.getItem('materials') || '[]'); }
    function getHistory(){ return JSON.parse(localStorage.getItem('order_history') || '[]'); }

    function showNotification() {
        const t = document.getElementById('studio-toast');
        t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 3000);
    }

    function updatePriceGram(){ 
        const s = document.getElementById('materialSelect');
        document.getElementById('priceGram').value = s.value ? rp(s.value/1000) : 'Rp 0';
    }

    function generateInvoiceNum(){
        const y = new Date().getFullYear();
        let num = parseInt(localStorage.getItem('inv_counter') || 1);
        const inv = `INV-${y}-${String(num).padStart(4, '0')}`;
        document.getElementById('invDisplay').innerText = inv;
        return inv;
    }

    function calculateAndSave() {
        if(!isEditMode) generateInvoiceNum();
        calculate(false);
        showNotification();
        isEditMode = false;
    }

    function calculate(isLoading = false){
        const [h, m] = document.getElementById('time').value.split(':').map(Number);
        const hrs = h + (m/60);
        const s = JSON.parse(localStorage.getItem('setup_3d') || '{"depr":2100,"operator":2000,"watt":100,"kwh":1500,"maint":750}');
        
        const totalW = (+document.getElementById('weight').value||0) + (+document.getElementById('support').value||0) + (+document.getElementById('waste').value||0);
        const matCost = totalW * ((document.getElementById('materialSelect').value||0)/1000);
        const electricity = (s.watt/1000) * hrs * s.kwh;
        const opCost = (hrs * (s.depr + s.operator + s.maint)) + electricity;
        
        const hpp = matCost + opCost;
        const sub = hpp + (hpp * (+document.getElementById('profit').value/100)) + (hpp * (+document.getElementById('risk').value/100));
        const disc = sub * (+document.getElementById('discount').value/100);
        const tax = (sub - disc) * (+document.getElementById('taxActive').value/100);
        const grand = (sub - disc) + tax;

        document.getElementById('total').innerText = rp(grand);
        document.getElementById('breakdown').innerHTML = `HPP: ${rp(hpp)} | Pajak: ${rp(tax)}`;

        const inv = document.getElementById('invDisplay').innerText;
        lastCalculatedData = { inv, total: grand, subtotal: sub, discAmount: disc, taxAmount: tax, status: document.getElementById('paymentStatus').value };

        const history = getHistory();
        const entry = {
            inv, cust: document.getElementById('customer').value, item: document.getElementById('itemName').value,
            total: grand, hpp, netProfit: grand - hpp - tax, status: lastCalculatedData.status,
            details: { weight: document.getElementById('weight').value, time: document.getElementById('time').value, matName: document.getElementById('materialSelect').options[document.getElementById('materialSelect').selectedIndex]?.text, profit: profit.value, risk: risk.value, tax: taxActive.value, discount: discount.value }
        };

        const idx = history.findIndex(x => x.inv === inv);
        if(idx > -1) history[idx] = entry; else history.unshift(entry);
        localStorage.setItem('order_history', JSON.stringify(history));
        
        if(!isLoading && inv.includes(localStorage.getItem('inv_counter') || '1')) {
            localStorage.setItem('inv_counter', parseInt(localStorage.getItem('inv_counter')||1)+1);
        }
        renderHistory();
    }

    function initChart(labels, profitData, hppData) {
        const ctx = document.getElementById('performanceChart').getContext('2d');
        if(performanceChart) performanceChart.destroy();
        performanceChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels,
                datasets: [
                    { label: 'Profit', data: profitData, backgroundColor: '#10b981', borderRadius: 5 },
                    { label: 'HPP', data: hppData, backgroundColor: '#cbd5e1', borderRadius: 5 }
                ]
            },
            options: { responsive: true, maintainAspectRatio: false, scales: { x: { stacked: true }, y: { stacked: true } } }
        });
    }

    function renderHistory(){
        const list = document.getElementById('historyList');
        const search = document.getElementById('historySearch').value.toLowerCase();
        list.innerHTML = '';
        let rev = 0, prof = 0;
        const history = getHistory();
        const cLabels = [], cProf = [], cHpp = [];

        history.slice(0, 7).reverse().forEach(x => {
            cLabels.push(x.inv.split('-').pop());
            cProf.push(x.netProfit);
            cHpp.push(x.hpp);
        });

        history.forEach((x, i) => {
            if(x.cust.toLowerCase().includes(search) || x.inv.toLowerCase().includes(search)){
                rev += x.total; prof += x.netProfit;
                list.innerHTML += `<tr>
                    <td class="ps-4 fw-bold text-success">${x.inv}</td>
                    <td>${x.cust}</td>
                    <td><span class="badge-custom">${x.item}</span></td>
                    <td><span class="badge ${x.status==='LUNAS'?'bg-success':'bg-warning text-dark'}">${x.status}</span></td>
                    <td class="fw-bold">${rp(x.total)}</td>
                    <td class="text-center">
                        <button class="btn-action btn-edit" onclick="loadFromHistory(${i})">Buka</button>
                    </td>
                </tr>`;
            }
        });
        document.getElementById('statRevenue').innerText = rp(rev);
        document.getElementById('statProfit').innerText = rp(prof);
        initChart(cLabels, cProf, cHpp);
    }

    function loadFromHistory(i){
        const x = getHistory()[i];
        isEditMode = true;
        document.getElementById('customer').value = x.cust;
        document.getElementById('itemName').value = x.item;
        document.getElementById('invDisplay').innerText = x.inv;
        document.getElementById('weight').value = x.details.weight;
        document.getElementById('time').value = x.details.time;
        document.getElementById('profit').value = x.details.profit;
        document.getElementById('paymentStatus').value = x.status;
        document.querySelector('[data-bs-target="#calc"]').click();
        calculate(true);
    }

    function renderInventory(){
        const list = document.getElementById('materialList');
        const sel = document.getElementById('materialSelect');
        list.innerHTML = ''; sel.innerHTML = '';
        getMaterials().forEach((m, i) => {
            list.innerHTML += `<div class="list-group-item d-flex justify-content-between">
                <span><b>${m.name}</b> - ${rp(m.price)}</span>
                <button class="btn-action btn-del" onclick="deleteMaterial(${i})">Hapus</button>
            </div>`;
            sel.innerHTML += `<option value="${m.price}">${m.name}</option>`;
        });
        updatePriceGram();
    }

    function deleteMaterial(i){ const m = getMaterials(); m.splice(i,1); localStorage.setItem('materials', JSON.stringify(m)); renderInventory(); }
    function resetInvCounter(){ localStorage.setItem('inv_counter', 1); generateInvoiceNum(); }

    function exportPDF(){
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.text("INVOICE SIMPANG STUDIO", 10, 10);
        doc.text(`Invoice: ${lastCalculatedData.inv}`, 10, 20);
        doc.text(`Pelanggan: ${document.getElementById('customer').value}`, 10, 30);
        doc.text(`Total: ${rp(lastCalculatedData.total)}`, 10, 40);
        doc.save(`${lastCalculatedData.inv}.pdf`);
    }

    document.addEventListener('DOMContentLoaded', () => {
        renderInventory(); renderHistory(); generateInvoiceNum();
        document.getElementById('materialSelect').addEventListener('change', updatePriceGram);
    });
</script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD3pKjssC6NRKXDfhHsr65al9maZto2IgQ",
        authDomain: "simpang-studio.firebaseapp.com",
        projectId: "simpang-studio",
        storageBucket: "simpang-studio.firebasestorage.app",
        messagingSenderId: "776018160572",
        appId: "1:776018160572:web:e6d11f9bb1db79173959b9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.saveMaterial = async () => {
        const name = document.getElementById('matName').value;
        const price = Number(document.getElementById('matPrice').value);
        if(name && price) {
            await setDoc(doc(db, "materials", name), { name, price });
            const m = getMaterials(); m.push({name, price});
            localStorage.setItem('materials', JSON.stringify(m));
            renderInventory();
        }
    };

    onSnapshot(collection(db, "materials"), (snap) => {
        const m = []; snap.forEach(d => m.push(d.data()));
        localStorage.setItem('materials', JSON.stringify(m));
        renderInventory();
    });
</script>
</body>
</html>
